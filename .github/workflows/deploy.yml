name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required secrets
        run: |
          missing=0
          for v in STRAPI_URL STRAPI_TOKEN REVALIDATE_WEBHOOK_SECRET CF_PAGES_DEPLOY_HOOK_URL; do
            if [ -z "${!v}" ]; then echo "::error::$v is not configured as a GitHub secret"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          REVALIDATE_WEBHOOK_SECRET: ${{ secrets.REVALIDATE_WEBHOOK_SECRET }}
          CF_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}

      - name: Build
        run: pnpm build
        env:
          STRAPI_URL: ${{ secrets.STRAPI_URL }}
          STRAPI_TOKEN: ${{ secrets.STRAPI_TOKEN }}
          REVALIDATE_WEBHOOK_SECRET: ${{ secrets.REVALIDATE_WEBHOOK_SECRET }}
          CF_PAGES_DEPLOY_HOOK_URL: ${{ secrets.CF_PAGES_DEPLOY_HOOK_URL }}

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
